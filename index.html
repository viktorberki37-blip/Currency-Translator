
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <title>💱 Czech Kč to Euro Translator</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px 16px;
      background: white;
      color: black;
      font-family: Arial, Helvetica, sans-serif;
      text-align: center;
    }

    h1 {
      font-size: clamp(27px, 5vw, 52px);
      font-weight: 500;
      margin: 25px 0 55px;
    }

    .currencies {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      max-width: 600px;
      margin: 0 auto 35px;
    }

    .flag {
      font-size: 95px;
      line-height: 1.4;
    }

    .currency-name {
      font-size: clamp(32px, 6vw, 48px);
      font-weight: 800;
      margin: 0;
    }

    .translator {
      display: grid;
      grid-template-columns: minmax(0, 0.8fr) minmax(0, 1.6fr);
      gap: 20px;
      max-width: 700px;
      margin: auto;
      align-items: stretch;
    }

    .amount-box {
      background: black;
      color: white;
      min-width: 0;
      min-height: 130px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 18px 12px;
    }

    .amount-box label {
      font-size: clamp(16px, 3vw, 23px);
      font-weight: bold;
      margin-bottom: 14px;
    }

    input {
      width: 100%;
      min-width: 0;
      border: 0;
      border-bottom: 2px solid white;
      outline: none;
      border-radius: 0;
      background: black;
      color: white;
      text-align: center;
      font-size: clamp(24px, 4vw, 34px);
      font-weight: bold;
      padding: 8px 0;
    }

    input:focus {
      border-bottom-color: #ffcc00;
    }

    #result {
      overflow-wrap: anywhere;
      font-size: clamp(27px, 5vw, 42px);
      font-weight: bold;
      margin: 0;
    }

    #rate-status {
      font-size: 13px;
      color: #555;
      margin: 18px auto 0;
      max-width: 700px;
    }

    @media (max-width: 420px) {
      body {
        padding: 16px 10px;
      }

      h1 {
        margin: 20px 0 35px;
      }

      .currencies {
        gap: 8px;
        margin-bottom: 25px;
      }

      .flag {
        font-size: 70px;
      }

      .translator {
        gap: 10px;
      }

      .amount-box {
        padding: 14px 8px;
        min-height: 125px;
      }
    }
  </style>
</head>

<body>
  <h1>💱 Czech Kč to Euro Translator</h1>

  <main>
    <section class="currencies">
      <div>
        <div class="flag" aria-label="Czech Republic flag">🇨🇿</div>
        <p class="currency-name">Kč</p>
      </div>

      <div>
        <div class="flag" aria-label="Germany flag">🇩🇪</div>
        <p class="currency-name">Euro</p>
      </div>
    </section>

    <section class="translator">
      <div class="amount-box">
        <label for="amount">Kč amount</label>
        <input
          id="amount"
          type="text"
          inputmode="decimal"
          placeholder="100"
          autocomplete="off"
          aria-label="Amount in Czech koruna"
        >
      </div>

      <div class="amount-box" aria-live="polite">
        <label>Translated amount in Euro</label>
        <p id="result">€ 0.00</p>
      </div>
    </section>

    <p id="rate-status">Loading exchange rate...</p>
  </main>

  <script>
    const amountInput = document.getElementById("amount");
    const result = document.getElementById("result");
    const status = document.getElementById("rate-status");

    // Approximate fallback rate. Updated when the live rate loads.
    let rate = 0.0410566;
    let usingLiveRate = false;

    function convert() {
      const raw = amountInput.value.trim();

      if (raw === "") {
        result.textContent = "€ 0.00";
        return;
      }

      // Accept both 100.50 and 100,50.
      const normalized = raw.replace(",", ".");
      const amount = Number(normalized);

      if (!Number.isFinite(amount) || amount < 0) {
        result.textContent = "Invalid amount";
        return;
      }

      const euros = amount * rate;

      result.textContent = euros.toLocaleString("de-DE", {
        style: "currency",
        currency: "EUR",
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      });
    }

    async function loadRate() {
      // Use the last saved rate first, if available.
      try {
        const saved = JSON.parse(
          localStorage.getItem("czk-eur-rate")
        );

        if (
          saved &&
          Number.isFinite(saved.rate) &&
          saved.rate > 0
        ) {
          rate = saved.rate;
          convert();
        }
      } catch (error) {
        // Continue with the fallback rate.
      }

      try {
        const response = await fetch(
          "https://api.frankfurter.app/latest?from=CZK&to=EUR"
        );

        if (!response.ok) {
          throw new Error("Rate unavailable");
        }

        const data = await response.json();
        const newRate = data.rates && data.rates.EUR;

        if (!Number.isFinite(newRate) || newRate <= 0) {
          throw new Error("Invalid rate");
        }

        rate = newRate;
        usingLiveRate = true;

        localStorage.setItem(
          "czk-eur-rate",
          JSON.stringify({
            rate: rate,
            date: data.date
          })
        );

        status.textContent =
          `Exchange rate: 1 Kč = ${rate.toFixed(5)} € · ` +
          `Rate date: ${data.date}`;

      } catch (error) {
        status.textContent = usingLiveRate
          ? "Using the last loaded exchange rate."
          : "Offline: using an approximate exchange rate.";

        // If a saved rate exists, it remains usable offline.
      }

      convert();
    }

    amountInput.addEventListener("input", convert);

    loadRate();
  </script>
</body>
  </html>
